dataset:
  path: data/test_sample_concise.xlsx
  sheet: sample_windows

features:
  dimension: 8

  names:
    - write_rate
    - rename_rate
    - unique_dirs
    - files_modified
    - entropy
    - dir_dispersion
    - proc_cpu_pct
    - handle_count

temporal:
  window_size_ms: 500
  sequence_length: 6
  lookback_seconds: 3

training:
  batch_size: 16
  epochs: 30
  learning_rate: 0.001

model:
  hidden_dim: 32
  num_layers: 1

paths:
  scaler: models/scaler.pkl
  model: models/ransomware_lstm.pth